databases:
  - name: committee-tracker-db
    plan: basic-256mb
    databaseName: committee_tracker
    user: committee_tracker
services:
  - type: web
    name: committee-contact-tracker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && flask --app app bootstrap-admin && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: committee-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_MOBILE
        value: "7338884040"

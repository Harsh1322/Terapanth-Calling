databases:
  - name: committee-tracker-db
    plan: basic-256mb
    databaseName: committee_tracker
    user: committee_tracker
services:
  - type: web
    name: committee-contact-tracker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py bootstrap_admin && gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: committee-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_MOBILE
        value: "7338884040"
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

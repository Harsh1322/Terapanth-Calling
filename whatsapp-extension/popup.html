<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:300px;padding:12px}button{padding:9px;background:#155eef;color:white;border:0;border-radius:6px;margin:4px 0;width:100%}p{color:#475467;font-size:12px}input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #98a2b3;border-radius:6px}</style></head><body><h3>Group contact extractor</h3><p>1. Open WhatsApp Web and sign in. 2. Open the group whose contacts you want, open its participant list, and scroll through it. 3. Scan and download the reviewable CSV.</p><button id="open-whatsapp">Open WhatsApp Web</button><label for="group-name">Group name (optional)</label><input id="group-name" placeholder="For example: Chennai Committee"><button id="scan">Scan visible participants</button><button id="download">Download CSV</button><div id="status">No scan yet.</div><script src="popup.js"></script></body></html>

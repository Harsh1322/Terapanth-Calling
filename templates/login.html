{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width:430px;margin:8vh auto">
  <h1>Sign in</h1>
  <p class="muted">Enter the mobile number registered to your account.</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label for="mobile">Mobile number</label><br><input id="mobile" name="mobile" type="text" autocomplete="username" placeholder="Mobile number" value="{{ mobile }}" required></p>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
